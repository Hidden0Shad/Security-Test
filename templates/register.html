<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | Sentinel</title><link rel="stylesheet" href="../static/CSS/style.css"></head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"></span>sentinel</a><a class="button button-light" href="login.html">Log in</a></header>
<main class="form-wrap"><section class="form-intro"><p class="eyebrow">Get started</p><h1>Make risk<br><em>visible.</em></h1><p class="hero-copy">Create your Sentinel workspace and give your team a clearer place to begin.</p></section><section class="form-panel"><h2>Create your account</h2><form data-demo-form><div class="form-row"><div><label for="first-name">First name</label><input id="first-name" name="firstName" required></div><div><label for="last-name">Last name</label><input id="last-name" name="lastName" required></div></div><label for="email">Work email</label><input id="email" type="email" name="email" required><label for="password">Password</label><input id="password" type="password" name="password" minlength="8" required><button class="button button-dark" type="submit">Create workspace</button></form><p class="form-note">Already have an account? <a href="login.html">Log in</a></p></section></main><div class="toast" role="status"></div><script src="../static/JS/script.js"></script></body></html>
